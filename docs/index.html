<style>
:root{
  --bg:#FFF6E6; --surface:#FFFDF8; --surface-2:#FBEBD3; --ink:#271D17; --ink-2:#5E5048; --muted:#8A7B70;
  --line:#EAD9C0; --grid:#F0E4D1; --accent:#A51009; --dot:#FDC300;
  --s-gastro:#A51009; --s-shop:#C08A00; --s-hotel:#1F6BB0;
  --good:#2E7D32; --bad:#A51009;
  --shadow:0 1px 0 rgba(39,29,23,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1E1713; --surface:#29201A; --surface-2:#342921; --ink:#FBEBD3; --ink-2:#D4C3AE; --muted:#A08F80;
    --line:#43362C; --grid:#382C24; --accent:#E0473D;
    --s-gastro:#B8261F; --s-shop:#BD8C00; --s-hotel:#3F8FD6;
    --good:#6FBF73; --bad:#F07068; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1E1713; --surface:#29201A; --surface-2:#342921; --ink:#FBEBD3; --ink-2:#D4C3AE; --muted:#A08F80;
  --line:#43362C; --grid:#382C24; --accent:#E0473D;
  --s-gastro:#B8261F; --s-shop:#BD8C00; --s-hotel:#3F8FD6;
  --good:#6FBF73; --bad:#F07068; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-family:Petrona,Georgia,serif;font-weight:700;font-size:34px;line-height:1;margin:0;color:var(--accent);letter-spacing:.01em}
.brand h1 small{font-size:13px;letter-spacing:.2em;color:var(--ink);vertical-align:top;margin-right:4px;font-family:"Work Sans",sans-serif;font-weight:600}
.brand h1 .pt{display:inline-block;width:.22em;height:.22em;border-radius:50%;background:var(--dot);margin-left:.06em}
.brand span{font-family:Petrona,Georgia,serif;font-size:20px;color:var(--ink-2)}
.daynav{display:flex;align-items:center;gap:8px}
.daynav button,.tabs button,.seg button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px}
.daynav button:hover,.tabs button:hover,.seg button:hover{border-color:var(--ink-2)}
.daynav button:disabled{opacity:.35;cursor:default}
.daynav .d{min-width:190px;text-align:center;font-weight:600}
.daynav .d small{display:block;font-weight:400;color:var(--muted);font-size:12px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px}
.tabs button{padding:8px 16px;font-weight:500;display:flex;align-items:center;gap:8px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs i{width:9px;height:9px;border-radius:50%;display:inline-block}
.status{font-size:12.5px;color:var(--muted);margin:6px 0 18px;display:flex;gap:14px;flex-wrap:wrap}
.status b{font-weight:600;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;position:relative}
.kpi.lead{border-top:3px solid var(--kc,var(--ink))}
.kpi .l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:600;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.delta{font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;display:inline-block;margin-right:6px}
.delta.up{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.delta.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.delta.flat{color:var(--muted);background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-family:Petrona,Georgia,serif;font-size:19px;font-weight:700;margin:0 0 2px;text-wrap:balance}
.panel .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:"Work Sans",sans-serif}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 10px;border-radius:8px;white-space:nowrap;z-index:5;transform:translate(-50%,-100%);margin-top:-8px;line-height:1.45}
.tip b{font-weight:600}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr.sel td{background:var(--surface-2);font-weight:600}
tfoot td{font-weight:600;border-top:1.5px solid var(--ink-2);border-bottom:0}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hbar .t{height:14px;background:var(--grid);border-radius:4px;overflow:hidden}
.hbar .t div{height:100%;border-radius:0 4px 4px 0}
.hbar .n{text-align:right;min-width:72px}
.hbar.share{grid-template-columns:minmax(90px,150px) 1fr auto auto}
.hbar .p{text-align:right;min-width:52px;color:var(--muted);font-size:12.5px}
.hgs{font-size:13px;font-weight:600;color:var(--ink-2);margin:-6px 0 12px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.est{color:var(--s-shop);font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
body.locked .tabs,body.locked .ctrl,body.locked #status{display:none}
.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.login h2{margin:0;font-family:Petrona,Georgia,serif;font-size:22px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink-2)}
.login input[type=text],.login input[type=password]{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.login .rm{flex-direction:row;align-items:center;gap:8px}
.login button{font:inherit;cursor:pointer;border:0;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-weight:600}
.login button:disabled{opacity:.6;cursor:wait}
.login .msg{min-height:1.4em;margin:0;color:var(--bad);font-size:13.5px}
.login .fine{margin:0;color:var(--muted);font-size:12.5px}
.logout{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:6px 12px}

.cfg{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.cfg input{font:inherit;width:80px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.cfg button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 10px}
</style>

<style>
.logo{margin:0;line-height:0}.logo img{height:44px;width:auto;display:block}.lg-d{display:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-l{display:none!important}:root:not([data-theme="light"]) .lg-d{display:block!important}}
:root[data-theme="dark"] .lg-l{display:none!important}:root[data-theme="dark"] .lg-d{display:block!important}
.brand{align-items:center!important}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:6px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.range[hidden],.daynav[hidden],.seg[hidden]{display:none!important}
.range{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.range input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
td.part{color:var(--muted)}
.ziele{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:6px}
.ziele label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.ziele input{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.btn{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 16px;font-weight:500}
.cov{font-size:12px;color:var(--muted)}
.ptable input.pi{font:inherit;font-size:13px;width:74px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.ptable input.wide{width:112px}.ptable input.pct{width:62px}.ptable input.wk{width:96px}
.ptable input.pi:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.ptable td,.ptable th{padding:5px 6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.plan-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.plan-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#view>.panel+.panel{margin-top:16px}
.plan-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.plan-weeks{max-height:560px;overflow:auto}
.plan-weeks thead th{position:sticky;top:0;background:var(--surface);z-index:1}
.bar-plan{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:6px}
.bar-plan div{height:100%;border-radius:3px}
</style>

<script>
(function(){
const AREAS={gastro:{n:'Gastro',c:'--s-gastro',src:'Melzer x3000'},shop:{n:'Shop',c:'--s-shop',src:'KST'},waschen:{n:'Waschen',c:'--ink-2',src:'KST'},hotel:{n:'Hotel / Seminar',c:'--s-hotel',src:'Mews'}};
const AK=['gastro','shop','waschen','hotel'];
const DEF_ZIELE={gastro:3600000,hotel:350000,shop:400000,waschen:70000};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'],WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
let DAYS=[],BY={},WEEKS={},CFG={},ZIELE=Object.assign({},DEF_ZIELE);
let mode='tag',cur=null,rFrom=null,rTo=null,tab='uebersicht';
const $=s=>document.querySelector(s);
const eur=(v,d=0)=>v==null||isNaN(v)?'–':v.toLocaleString('de-AT',{minimumFractionDigits:d,maximumFractionDigits:d})+' €';
const nf=(v,d=0)=>v==null||isNaN(v)?'–':v.toLocaleString('de-AT',{minimumFractionDigits:d,maximumFractionDigits:d});
const dObj=s=>new Date(s+'T12:00:00');
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=dObj(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((dObj(b)-dObj(a))/864e5);
const fmtD=s=>{const d=dObj(s);return WD[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
const fmtL=s=>dObj(s).toLocaleDateString('de-AT');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const g=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function isoWeek(s){const d=dObj(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return {y,w}}
function mondayOf(s){const d=dObj(s);const dn=d.getDay()||7;return addDays(s,1-dn)}
function mondayOfKW(y,w){const j4=iso(new Date(y,0,4,12));return addDays(mondayOf(j4),(w-1)*7)}

// ---------- range ----------
function range(){
  if(mode==='tag') return [cur,cur];
  if(mode==='woche'){const m=mondayOf(cur);return [m,addDays(m,6)]}
  if(mode==='monat'){const d=dObj(cur);const f=iso(new Date(d.getFullYear(),d.getMonth(),1,12));const t=iso(new Date(d.getFullYear(),d.getMonth()+1,0,12));return [f,t]}
  return [rFrom,rTo];
}
function prevRange([f,t]){
  if(mode==='monat'){const d=dObj(f);const pf=iso(new Date(d.getFullYear(),d.getMonth()-1,1,12));const pt=iso(new Date(d.getFullYear(),d.getMonth(),0,12));return [pf,pt]}
  const n=diffDays(f,t)+1;return [addDays(f,-n),addDays(t,-n)];
}
function rangeLabel([f,t]){
  if(mode==='tag'){const d=dObj(f);return `${WDL[d.getDay()]}, ${d.toLocaleDateString('de-AT',{day:'numeric',month:'long',year:'numeric'})}<small>Geschäftstag</small>`}
  if(mode==='woche'){const k=isoWeek(f);return `KW ${k.w} / ${k.y}<small>${fmtL(f)} – ${fmtL(t)}</small>`}
  if(mode==='monat'){const d=dObj(f);return `${MON[d.getMonth()]} ${d.getFullYear()}<small>${fmtL(f)} – ${fmtL(t)}</small>`}
  return `${fmtL(f)} – ${fmtL(t)}<small>${diffDays(f,t)+1} Tage</small>`;
}
function daysIn([f,t]){return DAYS.filter(d=>d.datum>=f&&d.datum<=t)}
function agg(rows){
  const A={n:rows.length};
  AK.forEach(a=>{const r=rows.filter(d=>d[a]);A[a]={tage:r.length,netto:r.reduce((s,d)=>s+(d[a].netto||0),0),est:r.some(d=>d[a].geschaetzt)}});
  A.gesamt=AK.reduce((s,a)=>s+A[a].netto,0);
  A.plan={};AK.forEach(a=>A.plan[a]=rows.filter(d=>d[a]).reduce((s,d)=>s+dayPlan(a,d.datum),0));
  A.plan.gesamt=AK.reduce((s,a)=>s+A.plan[a],0);
  return A;
}
function sumF(rows,path){let s=0,c=0;rows.forEach(r=>{const v=g(r,path);if(v!=null&&!isNaN(v)){s+=v;c++}});return c?s:null}
function sumObj(rows,path){const o={};rows.forEach(r=>{const x=g(r,path)||{};for(const k in x){if(typeof x[k]==='number')o[k]=(o[k]||0)+x[k]}});return o}

// ---------- ui helpers ----------
function pct(now,base){return now==null||!base?null:(now-base)/Math.abs(base)*100}
function chip(p,label){if(p==null)return '';const cls=Math.abs(p)<1?'flat':p>0?'up':'down';return `<span class="delta ${cls}">${p>0?'+':''}${nf(p,0)} %</span>${label?`<span>${label}</span>`:''}`}
function kpi(l,v,sub,colr){return `<div class="kpi${colr?' lead':''}" ${colr?`style="--kc:var(${colr})"`:''}><span class="l">${l}</span><span class="v">${v}</span>${sub?`<span class="s">${sub}</span>`:''}</div>`}
function planBar(ist,plan,c){if(!plan)return '';const p=Math.min(100,ist/plan*100);return `<div class="bar-plan" title="${nf(ist/plan*100,0)} % vom Plan"><div style="width:${p}%;background:var(${c})"></div></div>`}
function cmpLabel(){return mode==='tag'?'ggü. Vorwoche':mode==='woche'?'ggü. Vorwoche':mode==='monat'?'ggü. Vormonat':'ggü. Vorperiode'}
function cmpRange(r){return mode==='tag'?[addDays(r[0],-7),addDays(r[1],-7)]:prevRange(r)}
function pctTxt(v){return (v*100).toLocaleString('de-AT',{minimumFractionDigits:1,maximumFractionDigits:1})+' %'}
function hbars(obj,c,fmt=eur,share=false){
  const e=Object.entries(obj||{}).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]); if(!e.length) return '<p class="note">Keine Daten im gewählten Zeitraum.</p>';
  const m=e[0][1], tot=e.reduce((a,[,v])=>a+v,0);
  return `<div class="hbar${share?' share':''}">`+e.map(([k,v])=>`<span>${esc(k)}</span><div class="t"><div style="width:${v/m*100}%;background:var(${c})"></div></div><span class="n">${fmt(v)}</span>${share?`<span class="p">${pctTxt(v/tot)}</span>`:''}`).join('')+`</div>`;
}

// bars: rows with .label, series[{n,c,v(row)}], opt.plan(row) draws a plan tick
function barChart(el,rows,series,opt={}){

  const W=Math.max(320,el.clientWidth||700),H=opt.h||220,pl=54,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb,n=rows.length;

    });

    if(sel) s+=`<line x1="${x(i)-bw/2-3}" x2="${x(i)+bw/2+3}" y1="${pt+ih+2}" y2="${pt+ih+2}" stroke="${col('--ink')}" stroke-width="2"/>`;

    s+=`<rect data-i="${i}" x="${pl+iw/n*i}" y="${pt}" width="${iw/n}" height="${ih}" fill="transparent" style="cursor:${opt.click?'pointer':'default'}"/>`;
  });

  el.innerHTML=s+'<div class="tip" hidden></div>';
  const tip=el.querySelector('.tip'),f=opt.fmt||eur;

    const i=+rc.dataset.i,r=rows[i];
    rc.addEventListener('mouseenter',()=>{
      tip.innerHTML=`<b>${esc(r.title||r.label)}</b><br>`+series.map(se=>`<i style="background:${col(se.c)}"></i>${se.n}: ${f(se.v(r))}`).join('<br>')+
        (series.length>1?`<br><b>Summe: ${f(tot[i])}</b>`:'')+(opt.plan&&plans[i]?`<br>Plan: ${f(plans[i])}`:'');
      tipAt(el,tip,W,x(i),y(Math.max(tot[i],plans[i]||0)));

// ---------- plan model ----------
const PLANS={};
function weeksInYear(y){return isoWeek(`${y}-12-28`).w}
function planDoc(y){return PLANS[y]||null}
function planZiel(y,a){const P=planDoc(y);return P&&P.ziel&&P.ziel[a]!=null?+P.ziel[a]:(+ZIELE[a]||0)}
function weekPlan(a,y,w){const P=planDoc(y);const v=P&&P.wochen&&P.wochen[a]?P.wochen[a][w-1]:null;return v!=null?+v:planZiel(y,a)/52}
function wdWeights(y,a){const P=planDoc(y);const x=P&&P.wochentag&&P.wochentag[a];return x&&x.length===7&&x.some(v=>v>0)?x.map(Number):[1,1,1,1,1,1,1]}
function dayPlan(a,ds){const k=isoWeek(ds);const wt=wdWeights(k.y,a);const s=wt.reduce((p,v)=>p+v,0)||7;return weekPlan(a,k.y,k.w)*wt[(dObj(ds).getDay()+6)%7]/s}
function dayPlanAll(ds){return AK.reduce((s,a)=>s+dayPlan(a,ds),0)}
function monthDays(y){const L=(y%4===0&&y%100!==0)||y%400===0?366:365;const d=[31,L===366?29:28,31,30,31,30,31,31,30,31,30,31].map(x=>+(x/L*100).toFixed(2));d[11]=+(100-d.slice(0,11).reduce((q,v)=>q+v,0)).toFixed(2);return d}
function defaultPlan(y){
  const n=weeksInYear(y),p={jahr:y,ziel:{},monate:{},wochentag:{},wochen:{}};
  AK.forEach(a=>{p.ziel[a]=planZiel(y,a);p.monate[a]=monthDays(y);p.wochentag[a]=[1,1,1,1,1,1,1].map(v=>+(100/7).toFixed(2));p.wochen[a]=Array.from({length:n},(_,i)=>Math.round(weekPlan(a,y,i+1)))});
  const P=planDoc(y);
  if(P) AK.forEach(a=>{if(P.monate&&P.monate[a])p.monate[a]=P.monate[a].slice();if(P.wochentag&&P.wochentag[a])p.wochentag[a]=P.wochentag[a].slice()});
  return p;
}
// distribute annual target via monthly shares onto ISO weeks
function distribute(p,a){
  const y=p.jahr,n=weeksInYear(y),m1=mondayOfKW(y,1),sh=p.monate[a].map(Number),tot=sh.reduce((s,v)=>s+v,0)||1;
  const wk=Array(n).fill(0);
  for(let i=0;i<n*7;i++){const ds=addDays(m1,i),d=dObj(ds);const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();wk[Math.floor(i/7)]+=sh[d.getMonth()]/tot/dim}
  const s=wk.reduce((q,v)=>q+v,0);
  p.wochen[a]=wk.map(v=>Math.round(p.ziel[a]*v/s));
}

function markDirty(){dirty=true;const s=$('#pstate');if(s)s.textContent='Ungespeicherte Änderungen'}

      if(c.every(x=>x>0)){const av=s.map((v,i)=>v/c[i]),t=av.reduce((q,v)=>q+v,0);if(t>0){p.wochentag[a]=av.map(v=>+(v/t*100).toFixed(1));used++}}});

// weekly controlling
function weekIst(y,w,a){
  const doc=WEEKS[`${y}-${String(w).padStart(2,'0')}`];
  if(doc&&typeof doc[a]==='number') return {v:doc[a],src:'Excel',tage:7};
  const m=mondayOfKW(y,w),rows=daysIn([m,addDays(m,6)]).filter(d=>d[a]);
  if(!rows.length) return null;
  return {v:rows.reduce((s,d)=>s+d[a].netto,0),src:'Tagesberichte',tage:rows.length,plan:rows.reduce((s,d)=>s+dayPlan(a,d.datum),0)};
}
function vControlling(){
  const y=+(CFG.jahr||dObj(cur).getFullYear());
  const wk=Object.values(WEEKS).filter(d=>d.jahr===y).map(d=>d.kw);
  DAYS.forEach(d=>{const k=isoWeek(d.datum);if(k.y===y)wk.push(k.w)});
  const first=Math.min(...wk),last=Math.max(...wk);
  const weeks=[];for(let w=first;w<=last;w++)weeks.push(w);
  const pl=(o,a)=>!o[a]?0:o[a].tage<7&&o[a].plan!=null?o[a].plan:weekPlan(a,y,o.w);
  const data=weeks.map(w=>{const o={w};AK.forEach(a=>o[a]=weekIst(y,w,a));o.ges=AK.reduce((s,a)=>s+(o[a]?o[a].v:0),0);o.pg=AK.reduce((s,a)=>s+pl(o,a),0);return o});
  const cum=a=>{let s=0,p=0;return data.map(o=>{s+=a==='ges'?o.ges:(o[a]?o[a].v:0);p+=a==='ges'?o.pg:pl(o,a);return [s,p]})};
  const cg=cum('ges'),lastC=cg[cg.length-1]||[0,0];
  let h=`<div class="kpis">`+kpi(`Kumuliert KW ${first}–${last}`,eur(lastC[0]),chip(pct(lastC[0],lastC[1]),'vs. Plan '+eur(lastC[1]))+planBar(lastC[0],lastC[1],'--ink'),'--ink')+
    AK.map(a=>{const c=cum(a),l=c[c.length-1];return kpi(AREAS[a].n+' kumuliert',eur(l[0]),chip(pct(l[0],l[1]),'Abw. '+(l[0]-l[1]>=0?'+':'')+eur(l[0]-l[1])),AREAS[a].c)}).join('')+`</div>`;
  h+=`<div class="grid2"><div class="panel"><h2>Wochenumsatz gesamt</h2><p class="sub">Ist netto je KW, gestrichelt: Wochenplan gesamt</p>
      <div class="legend">${AK.map(a=>`<span><i style="background:var(${AREAS[a].c})"></i>${AREAS[a].n}</span>`).join('')}</div><div class="chart" id="c1"></div></div>
      <div class="panel"><h2>Kumuliert Ist gegen Plan</h2><p class="sub">Gesamt seit KW ${first}, Plan nur für Wochen mit Daten</p>
      <div class="legend"><span><i style="background:var(--accent)"></i>Ist kumuliert</span><span><i style="background:var(--ink-2)"></i>Plan kumuliert</span></div><div class="chart" id="c2"></div></div></div>`;
  h+=`<div class="panel"><h2>Wochentabelle</h2><p class="sub">Netto. Grau = Woche aus Tagesberichten, noch nicht vollständig; Plan dort anteilig. KW ohne Werte zählen nicht in den Plan.</p><div class="tbl"><table><thead><tr><th>KW</th>`+
    AK.map(a=>`<th>${AREAS[a].n}</th><th>Abw.</th>`).join('')+`<th>Gesamt</th><th>Abw.</th></tr></thead><tbody>`+
    data.slice().reverse().map(o=>{const pg=o.pg;const m=mondayOfKW(y,o.w);
      return `<tr><td>KW ${o.w} <span class="cov">${fmtD(m).slice(3)}</span></td>`+AK.map(a=>{const x=o[a];if(!x)return '<td>–</td><td></td>';const p=pct(x.v,weekPlan(a,y,o.w));
        return `<td class="${x.tage<7?'part':''}" title="Quelle: ${x.src}${x.tage<7?', '+x.tage+' von 7 Tagen':''}">${eur(x.v)}${x.tage<7?` <span class="cov">${x.tage}/7</span>`:''}</td><td class="${p>=0?'pos':'neg'}">${x.tage<7?'':(p>0?'+':'')+nf(p,0)+' %'}</td>`}).join('')+
        `<td><b>${eur(o.ges)}</b></td><td class="${o.ges>=pg?'pos':'neg'}">${pg?(o.ges>=pg?'+':'')+nf(pct(o.ges,pg),0)+' %':''}</td></tr>`}).join('')+
    `</tbody></table></div></div>`;
  h+=`<div class="panel" style="margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><div><h2>Plan ${y}</h2><p class="sub" style="margin:0">Jahresziel gesamt ${eur(AK.reduce((q,a)=>q+planZiel(y,a),0))}${planDoc(y)?'':' · noch als gleichmäßige Verteilung'}</p></div></div>`;
  $('#view').innerHTML=h;
  const rows=data.map(o=>({label:'KW'+o.w,title:'KW '+o.w,o}));
  barChart($('#c1'),rows,AK.map(a=>({n:AREAS[a].n,c:AREAS[a].c,v:r=>r.o[a]?r.o[a].v:0})),{label:'Wochenumsatz',plan:r=>r.o.pg});
  lineChart($('#c2'),weeks.map(w=>'KW'+w),[{n:'Plan kumuliert',c:'--ink-2',vals:cg.map(x=>x[1]),dash:true},{n:'Ist kumuliert',c:'--accent',vals:cg.map(x=>x[0]),area:true}],{label:'Kumuliert',titles:weeks.map(w=>'KW '+w)});
}

function render(){

  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
  const ctl=tab==='controlling'||tab==='planung';
  $('#mode').hidden=ctl; $('#nav').hidden=ctl||mode==='frei'; $('#range').hidden=ctl||mode!=='frei';
  if(mode==='frei'){ if(!rFrom){rTo=cur;rFrom=addDays(cur,-6)} $('#from').value=rFrom;$('#to').value=rTo; }
  const r=range();
  $('#dlabel').innerHTML=rangeLabel(r);
  $('#prev').disabled=r[0]<=DAYS[0].datum; $('#next').disabled=r[1]>=DAYS[DAYS.length-1].datum;

  $('#status').innerHTML=tab==='planung'?'<span>Werte netto in Euro</span>':ctl?`<span>Wochenwerte bis KW 38 aus der Excel-Datei „Umsatz-Controlling“, danach aus den Tagesberichten</span>`:
    AK.map(a=>{const n=rows.filter(d=>d[a]).length;return `<span>${AREAS[a].n}: <b>${mode==='tag'?(n?'Bericht da':'fehlt'):n+' Tage'}</b> (${AREAS[a].src})</span>`}).join('')+`<span>Daten bis <b>${fmtL(DAYS[DAYS.length-1].datum)}</b></span>`;
  ({uebersicht:vUebersicht,gastro:vGastro,shop:vShop,hotel:vHotel,controlling:vControlling,planung:vPlanung})[tab](r);
}
function step(dir){
  if(mode==='tag'){const i=DAYS.findIndex(d=>d.datum===cur),j=i+dir;if(DAYS[j])cur=DAYS[j].datum}
  else if(mode==='woche') cur=addDays(cur,7*dir);
  else if(mode==='monat'){const d=dObj(cur);cur=iso(new Date(d.getFullYear(),d.getMonth()+dir,1,12))}
  render();
}
$('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
$('#mode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;
  if(mode==='tag'&&!BY[cur]) cur=DAYS.filter(d=>d.datum<=cur).pop()?.datum||DAYS[DAYS.length-1].datum; render()});
$('#from').addEventListener('change',e=>{if(e.target.value){rFrom=e.target.value;if(rTo<rFrom)rTo=rFrom;render()}});
$('#to').addEventListener('change',e=>{if(e.target.value){rTo=e.target.value;if(rTo<rFrom)rFrom=rTo;render()}});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;try{history.replaceState(null,'','#'+tab)}catch(_){};render()});
const h0=(location.hash||'').slice(1); if(['gastro','shop','hotel','uebersicht','controlling'].includes(h0)) tab=h0;
let rt; addEventListener('resize',()=>{if(tab==='planung')return;clearTimeout(rt);rt=setTimeout(render,150)});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render)}catch(_){}
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ub64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const te=new TextEncoder();
const RK='dokl-cockpit-session';
let ENC=null;
function store(){try{return localStorage}catch(_){return null}}
async function uidOf(name){const d=await crypto.subtle.digest('SHA-256',te.encode('dokl-cockpit:'+name.trim().toLowerCase()));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32)}
async function fetchEnc(){const r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Datei nicht erreichbar ('+r.status+')');return r.json()}
async function unwrap(e,name,pw){
  const ent=e.keys[await uidOf(name)];if(!ent)return null;
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ent.salt),iterations:e.kdf.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  try{return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ent.iv)},kek,b64(ent.wk)))}catch(_){return null}
}
async function openData(e,raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},k,b64(e.ct));
  const txt=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
function show(D){
  document.body.classList.remove('locked');
  DAYS=(D.tage||[]).slice().sort((a,b)=>a.datum<b.datum?-1:1);BY={};DAYS.forEach(d=>BY[d.datum]=d);
  WEEKS={};(D.wochen||[]).forEach(x=>WEEKS[`${x.jahr}-${String(x.kw).padStart(2,'0')}`]=x);
  CFG=D.betrieb||{};ZIELE=Object.assign({},DEF_ZIELE,D.ziele||{});
  (D.plan||[]).forEach(x=>{if(x&&x.jahr)PLANS[x.jahr]=x});
  if(!DAYS.length){$('#view').innerHTML='<div class="panel empty">Noch keine Tagesdaten vorhanden.</div>';return}
  if(!cur||!BY[cur]) cur=DAYS[DAYS.length-1].datum;
  render();
}
function loginForm(msg){
  document.body.classList.add('locked');
  $('#logout').hidden=true;
  $('#view').innerHTML=`<form class="panel login" id="lf" autocomplete="on"><h2>Gesellschafter-Zugang</h2>
    <label>Benutzername<input type="text" id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Passwort<input type="password" id="lp" autocomplete="current-password" required></label>
    <label class="rm"><input type="checkbox" id="lr">Auf diesem Gerät angemeldet bleiben</label>
    <button type="submit" id="lb">Anmelden</button><p class="msg" id="lm">${msg?esc(msg):''}</p>
    <p class="fine">Die Zahlen werden erst in deinem Browser mit deinem Passwort entschlüsselt.</p></form>`;
  $('#lf').onsubmit=async ev=>{ev.preventDefault();const b=$('#lb'),m=$('#lm');b.disabled=true;m.textContent='';b.textContent='Wird entschlüsselt …';
    try{
      ENC=ENC||await fetchEnc();
      const raw=await unwrap(ENC,$('#lu').value,$('#lp').value);
      if(!raw){m.textContent='Benutzername oder Passwort stimmt nicht.';return}
      const D=await openData(ENC,raw);
      const s=store();if(s){try{if($('#lr').checked)s.setItem(RK,JSON.stringify({v:ENC.kv,k:ub64(raw)}));else s.removeItem(RK)}catch(_){}}
      $('#logout').hidden=false;show(D);
    }catch(e){m.textContent='Fehler beim Laden: '+(e.message||e)}
    finally{b.disabled=false;b.textContent='Anmelden'}
  };
  setTimeout(()=>{const u=$('#lu');if(u)u.focus()},50);
}
$('#logout').onclick=()=>{const s=store();if(s){try{s.removeItem(RK)}catch(_){}}DAYS=[];BY={};loginForm('Abgemeldet.')};
(async()=>{
  document.body.classList.add('locked');
  try{ENC=await fetchEnc()}catch(e){$('#view').innerHTML='<div class="panel empty">Daten konnten nicht geladen werden. '+esc(e.message||'')+'</div>';return}
  const s=store();let saved=null;if(s){try{saved=JSON.parse(s.getItem(RK)||'null')}catch(_){}}
  if(saved&&saved.k){try{const D=await openData(ENC,b64(saved.k));$('#logout').hidden=false;show(D);return}catch(_){try{s.removeItem(RK)}catch(__){}}}
  loginForm(saved?'Der Zugang wurde erneuert. Bitte neu anmelden.':'');
})();
})();
</script>
